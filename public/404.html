<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | WW2 Family Photos</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="not-found-page">
    <header class="site-header" aria-label="Site header">
      <a class="brand" href="/" aria-label="WW2 Family Photos home">
        <span class="brand-mark">1940s</span>
        <span>Family Archive</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/#about">About</a>
        <a href="/#photos">Photos</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero not-found-hero" aria-label="Page not found">
        <div class="hero-overlay"></div>
        <a class="hero-collage" href="/#photos" aria-label="Open the photo gallery">
          <span class="collage-photo collage-photo-one"></span>
          <span class="collage-photo collage-photo-two"></span>
          <span class="collage-photo collage-photo-three"></span>
          <span class="collage-photo collage-photo-four"></span>
          <span class="collage-photo collage-photo-five"></span>
        </a>
        <div class="hero-content not-found-content">
          <p class="kicker">404</p>
          <h1>Page Not Found</h1>
          <p>
            This archive page may have moved, or the link may have been copied
            before the gallery was ready.
          </p>
          <div class="hero-actions" aria-label="404 navigation">
            <a class="hero-link" href="/">Home</a>
            <a class="hero-link hero-link-secondary" href="/#photos">View Galleries</a>
            <a class="hero-link hero-link-secondary" href="/#about">About the Archive</a>
          </div>
          <div class="not-found-details" aria-label="Suggested places">
            <span>Browse family photos</span>
            <span>Read the archive note</span>
            <span>Upload new images</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
